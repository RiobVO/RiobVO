<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <style>
    .flow { stroke-dasharray: 4 6; animation: dash 1.1s linear infinite; }
    .flowback { stroke-dasharray: 4 6; animation: dashback 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -10; } }
    @keyframes dashback { to { stroke-dashoffset: 10; } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#241a3d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="#1a1230"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- crop marks -->
  <g stroke="#4a3a6a" stroke-width="1.5">
    <path d="M 20 32 V 20 H 32" fill="none"/>
    <path d="M 1248 20 H 1260 V 32" fill="none"/>
    <path d="M 1260 288 V 300 H 1248" fill="none"/>
    <path d="M 32 300 H 20 V 288" fill="none"/>
  </g>

  <line x1="40" y1="44" x2="1240" y2="44" stroke="#3a2a55" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="40" y1="276" x2="1240" y2="276" stroke="#3a2a55" stroke-width="1" stroke-dasharray="3 5"/>

  <text x="60" y="36" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6b5a8a" letter-spacing="2">FIG.01 - SYSTEM SHEET</text>
  <text x="1220" y="36" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6b5a8a" letter-spacing="2">REV.04 / 2026</text>

  <text x="80" y="150" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-size="64" font-weight="500" fill="#f0ebff" letter-spacing="-2">Engineered by <tspan fill="#b89dff">@RiobVo</tspan></text>
  <text x="80" y="196" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-size="22" fill="#a89cc4">Independent engineering practice.</text>
  <text x="80" y="228" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-size="22" fill="#a89cc4">I design, build, and operate software — end to end.</text>

  <!-- closed-loop diagram -->
  <g transform="translate(810, 82)">
    <!-- BRIEF -->
    <rect x="0" y="40" width="80" height="40" fill="none" stroke="#b89dff" stroke-width="1.5"/>
    <text x="40" y="65" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#b89dff" letter-spacing="1.5">BRIEF</text>

    <!-- forward flow -->
    <line x1="82" y1="60" x2="118" y2="60" stroke="#b89dff" stroke-width="1.5" class="flow"/>
    <polygon points="118,55 128,60 118,65" fill="#b89dff"/>

    <!-- PRACTICE -->
    <rect x="130" y="20" width="100" height="80" fill="none" stroke="#b89dff" stroke-width="2"/>
    <text x="180" y="10" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#b89dff" letter-spacing="1.5">PRACTICE</text>
    <circle cx="180" cy="60" r="20" fill="none" stroke="#b89dff" stroke-width="1.5"/>
    <circle cx="180" cy="60" r="6" fill="#b89dff"/>
    <circle cx="180" cy="60" r="6" fill="none" stroke="#b89dff" stroke-width="1">
      <animate attributeName="r" from="6" to="28" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <!-- forward flow -->
    <line x1="232" y1="60" x2="268" y2="60" stroke="#b89dff" stroke-width="1.5" class="flow"/>
    <polygon points="268,55 278,60 268,65" fill="#b89dff"/>

    <!-- OPERATE -->
    <rect x="280" y="40" width="80" height="40" fill="none" stroke="#b89dff" stroke-width="1.5"/>
    <text x="320" y="65" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#b89dff" letter-spacing="1.5">OPERATE</text>

    <!-- feedback loop -->
    <path d="M 320 82 V 122 H 180 V 108" fill="none" stroke="#8a74c4" stroke-width="1.5" class="flowback"/>
    <polygon points="175,110 180,100 185,110" fill="#8a74c4"/>
    <text x="254" y="136" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8a74c4" letter-spacing="1.5">FEEDBACK</text>

    <!-- dimension line: end to end -->
    <g stroke="#5a4a80" stroke-width="1">
      <line x1="0" y1="158" x2="360" y2="158"/>
      <line x1="0" y1="152" x2="0" y2="164"/>
      <line x1="360" y1="152" x2="360" y2="164"/>
    </g>
    <rect x="130" y="150" width="100" height="16" fill="#1a1230"/>
    <text x="180" y="162" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5a4a80" letter-spacing="2">END TO END</text>
  </g>

  <text x="60" y="303" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#6b5a8a" letter-spacing="1">// RiobVo / independent / t.me/plssog</text>
  <circle cx="1118" cy="299" r="4" fill="#9d8aff" class="pulse"/>
  <text x="1220" y="303" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#b89dff" letter-spacing="1">IN PRODUCTION</text>
</svg>
